name: Integración Continua

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main, deploy]

jobs:
  backend-ventas:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Compilar y testear Backend Ventas
        run: |
          cd back-Ventas_SpringBoot/Springboot-API-REST
          mvn test --batch-mode

  backend-despachos:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Compilar y testear Backend Despachos
        run: |
          cd back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          mvn test --batch-mode

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: front_despacho/package-lock.json

      - name: Instalar dependencias y build
        run: |
          cd front_despacho
          npm ci
          npm run build

name: Despliegue EKS en AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  CLUSTER: devops-parcial2-cluster

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login en ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Obtener AWS Account ID
        run: |
          echo "ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_ENV

      - name: Definir URLs de ECR
        run: |
          echo "VENTAS_ECR=$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/devops-parcial2-backend-ventas" >> $GITHUB_ENV
          echo "DESPACHOS_ECR=$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/devops-parcial2-backend-despachos" >> $GITHUB_ENV
          echo "FRONTEND_ECR=$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/devops-parcial2-frontend" >> $GITHUB_ENV

      - name: Build y Push backend-ventas
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t $VENTAS_ECR:$GITHUB_SHA \
            ./back-Ventas_SpringBoot/Springboot-API-REST \
            --load
          docker push $VENTAS_ECR:$GITHUB_SHA

      - name: Build y Push backend-despachos
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t $DESPACHOS_ECR:$GITHUB_SHA \
            ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO \
            --load
          docker push $DESPACHOS_ECR:$GITHUB_SHA

      - name: Build y Push frontend
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t $FRONTEND_ECR:$GITHUB_SHA \
            ./front_despacho \
            --load
          docker push $FRONTEND_ECR:$GITHUB_SHA

      - name: Instalar kubectl
        uses: azure/setup-kubectl@v4

      - name: Conectar a EKS
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $CLUSTER

      - name: Aplicar manifiestos Kubernetes
        run: |
          kubectl apply -f infra/k8s/

      - name: Actualizar imagen backend-ventas
        run: |
          kubectl set image deployment/backend-ventas \
            backend-ventas=$VENTAS_ECR:$GITHUB_SHA

      - name: Actualizar imagen backend-despachos
        run: |
          kubectl set image deployment/backend-despachos \
            backend-despachos=$DESPACHOS_ECR:$GITHUB_SHA

      - name: Actualizar imagen frontend
        run: |
          kubectl set image deployment/frontend \
            frontend=$FRONTEND_ECR:$GITHUB_SHA

      - name: Esperar despliegue backend-ventas
        run: |
          kubectl rollout status deployment/backend-ventas

      - name: Esperar despliegue backend-despachos
        run: |
          kubectl rollout status deployment/backend-despachos

      - name: Esperar despliegue frontend
        run: |
          kubectl rollout status deployment/frontend

      - name: Obtener URL del frontend
        run: |
          echo "========================================"
          kubectl get service frontend -o jsonpath='{.status.loadBalancer.ingress[0].hostname}'
          echo ""
          echo "========================================"
